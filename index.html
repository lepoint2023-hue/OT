<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OT Sainte-Ode 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e9e2;--panel:rgba(250,247,240,.93);--ink:#24301f;--muted:#5d6656;--green:#3f5a3a;--ochre:#c4922f;--line:rgba(36,48,31,.15)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(30,40,25,.13)}
#top{left:16px;top:16px;padding:14px 16px;width:min(340px,calc(100vw - 32px))}
h1{font-family:Fraunces,Georgia,serif;font-size:20px;margin:0 0 2px;font-weight:700;color:var(--green);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.seg{display:flex;background:#e6e0d2;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font:600 13px Inter,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 6px;font-weight:600}
.rooms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:500 12px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:500 12px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.tog.on{background:#f3e6c4;border-color:var(--ochre)}
#info{right:16px;top:16px;width:310px;padding:14px 16px;max-height:calc(100vh - 32px);overflow:auto}
#info header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;cursor:pointer}
#info h2{font-family:Fraunces,Georgia,serif;font-size:19px;margin:0;color:var(--green)}
#info .area{font-size:12px;color:var(--muted);margin:2px 0 8px}
#info ul{margin:0;padding-left:18px;font-size:13px;line-height:1.45}
#info li{margin-bottom:5px}
#info p{font-size:13px;line-height:1.45;margin:0 0 8px}
#info .note{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
#fold{border:0;background:none;font-size:14px;color:var(--muted);cursor:pointer;padding:0 2px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.sw div{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.sw span{display:block;height:26px;border-radius:6px;border:1px solid var(--line);margin-bottom:3px}
#mapWrap{left:16px;bottom:16px;padding:8px}
#mini{display:block;width:190px;height:190px;cursor:crosshair}
#help{left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;font-size:12px;color:var(--muted);white-space:nowrap}
#joy{position:fixed;left:50%;bottom:70px;margin-left:-60px;width:120px;height:120px;border-radius:50%;background:rgba(250,247,240,.6);border:1px solid var(--line);display:none;touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--green);opacity:.85}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font-family:Fraunces,Georgia,serif;color:var(--green);font-size:18px;z-index:10}
.collapsed ul,.collapsed .area,.collapsed .sw,.collapsed p,.collapsed .note{display:none}
[hidden]{display:none!important}
.thead{display:flex;align-items:center;gap:10px}
.thead h1{flex:1;margin:0;min-width:0}
.logo svg{width:38px;height:38px;display:block}
.fold{border:0;background:none;font-size:15px;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}
.fold:hover,.fold:focus-visible{background:#ece6d8}
.tbody{margin-top:10px}
#top.collapsed .tbody{display:none}
#showAll{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:9px 14px;font:600 12px Inter,sans-serif;cursor:pointer;color:var(--green)}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
#doorHint{left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font:600 13px Inter,sans-serif;color:var(--green);cursor:pointer;white-space:nowrap}
@media (max-height:600px){ #mapWrap,#help{display:none} }
@media (max-width:820px){
  #info{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:38vh}
  #mapWrap,#help{display:none}
  #top{padding:10px 12px}
  .sub{display:none}
  #joy{bottom:auto;top:50%}
}
</style>
<script>
/* Si la maquette ne démarre pas (navigateur, réseau…), afficher la raison au lieu d'un écran figé */
(function(){
  function show(msg){ var el=document.getElementById('loading'); if(!el||el.dataset.err) return; el.dataset.err='1';
    el.innerHTML='<div style="max-width:520px;padding:16px;text-align:center;font:14px Inter,system-ui,sans-serif;color:#24301f;line-height:1.5"><div style="font:700 19px Fraunces,Georgia,serif;color:#3f5a3a;margin-bottom:10px">La maquette n’a pas pu démarrer</div>'+msg+'<div style="margin-top:12px;color:#5d6656">Rechargez la page. Si le problème persiste, ouvrez-la dans un navigateur à jour (Firefox, Chrome ou Edge) avec l’accélération graphique activée.</div></div>'; }
  function esc(s){ return String(s).replace(/[<>&]/g,function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }
  window.addEventListener('error',function(e){ show('Détail technique : '+esc(e.message||e.error||'erreur inconnue')); });
  window.addEventListener('unhandledrejection',function(e){ show('Détail technique : '+esc((e.reason&&e.reason.message)||e.reason)); });
  setTimeout(function(){ var el=document.getElementById('loading'); if(el&&el.isConnected&&!el.dataset.err) el.insertAdjacentHTML('beforeend','<div style="font:13px Inter,system-ui,sans-serif;margin-top:10px;color:#5d6656">Le premier chargement peut prendre une dizaine de secondes…</div>'); },5000);
  setTimeout(function(){ var el=document.getElementById('loading'); if(el&&el.isConnected&&!el.dataset.err) show('Le chargement prend anormalement longtemps (plus de 45 secondes).'); },45000);
})();
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading">Construction de la maquette…</div>

<div id="top" class="panel">
  <div class="thead"><span class="logo" id="logoSlot"></span><h1>Office du Tourisme · Sainte-Ode</h1><button class="fold" id="topFold" aria-label="Replier le panneau">▾</button></div>
  <div class="tbody">
  <p class="sub">Proposition d'aménagement — rez-de-chaussée, Rue de la Vallée de l'Ourthe 23E. Accueil et salle de réunion aux cotes relevées.</p>
  <div class="seg"><button id="mOver" class="on">Vue d'ensemble</button><button id="mVisit">Visite à pied</button></div>
  <div class="lbl">Pièces</div>
  <div class="rooms" id="rooms"></div>
  <div class="lbl">Options</div>
  <div class="toggles">
    <button class="tog" id="tScreen">Écran de projection</button>
    <button class="tog" id="tEve">Ambiance soir</button>
    <button class="tog on" id="tLabels">Étiquettes</button>
    <button class="tog" id="tAO">Ombres douces</button>
    <button class="tog" id="tHide">Masquer les panneaux (H)</button>
  </div>
  </div>
</div>
<button id="showAll" class="panel" hidden>Afficher les panneaux</button>
<button id="doorHint" class="panel" hidden>Ouvrir la porte</button>

<div id="info" class="panel"></div>
<div id="mapWrap" class="panel"><canvas id="mini" width="380" height="380"></canvas></div>
<div id="help" class="panel"></div>
<div id="joy"><i></i></div>

const NG=256, NOISE=new Float32Array(NG*NG).map(()=>R());
function vnoise(x,y,px,py){ const xi=Math.floor(x), yi=Math.floor(y), fx=x-xi, fy=y-yi, sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
  const m=(a,b)=>NOISE[((((b%py)+py)%py)%NG)*NG+((((a%px)+px)%px)%NG)]; const a=m(xi,yi), b=m(xi+1,yi), c=m(xi,yi+1), d=m(xi+1,yi+1);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy; }
function fbm(u,v,bx,oct=4,by=bx){ let s=0,a=.5,fx=bx,fy=by; for(let o=0;o<oct;o++){ s+=a*vnoise(u*fx,v*fy,fx,fy); fx*=2; fy*=2; a*=.5; } return s/(1-Math.pow(.5,oct)); }

  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const l=hg[y*w+(x-1+w)%w], r=hg[y*w+(x+1)%w], u=hg[((y-1+h)%h)*w+x], dn=hg[((y+1)%h)*w+x];
    const nx=(l-r)*str, ny=(dn-u)*str, L=Math.hypot(nx,ny,1), i=(y*w+x)*4; d[i]=(nx/L*.5+.5)*255; d[i+1]=(ny/L*.5+.5)*255; d[i+2]=(1/L*.5+.5)*255; d[i+3]=255; }
  g.putImageData(im,0,0); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=maxAniso; t.repeat.set(rep,rep); return t; }
function normalFromCanvas(c,str,inv,rep){ const w=c.width,h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data, hg=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){ const l=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)/255; hg[i]=inv?1-l:l; } return normalTex(hg,w,h,str,rep); }
function pixelTex(w,h,fn,rep,str){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); const im=g.createImageData(w,h), d=im.data, hg=new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const o=fn(x,y,x/w,y/h), i=(y*w+x)*4; d[i]=o[0]; d[i+1]=o[1]; d[i+2]=o[2]; d[i+3]=255; hg[y*w+x]=o[3]; }
  g.putImageData(im,0,0); const map=new THREE.CanvasTexture(c); map.colorSpace=THREE.SRGBColorSpace; map.wrapS=map.wrapT=THREE.RepeatWrapping; map.anisotropy=maxAniso; map.repeat.set(rep,rep);

  const pts=[]; for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const c=pal[Math.floor(R()*pal.length)], v=.82+R()*.3; pts.push({x:(i+.12+R()*.76)*cw, y:(j+.2+R()*.6)*ch, c:[c[0]*v,c[1]*v,c[2]*v], hh:.65+R()*.35, rust:R()}); }

  canvas.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
  canvas.addEventListener('pointerup',e=>{ if(mode!=='visit'||!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>6) return;
    const r=canvas.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);
    const hit=ray.intersectObjects(doors.flatMap(d=>d.hinges.map(h=>h.g)),true)[0]; if(hit&&hit.distance<4.5) toggleDoor(hit.object.userData.door); }); }
function updateDoors(dt){ for(const d of doors){
    // porte automatique : s'ouvre à l'approche (< 1,7 m), se referme quand on s'éloigne (> 2,3 m), sauf choix manuel
    const dist=mode==='visit'?Math.hypot(d.x-player.x,d.z-player.y):99;
    if(dist<1.7&&!d.near){ d.near=true; if(!d.manualClosed) setDoor(d,true); }
    else if(dist>2.3&&d.near){ d.near=false; if(!d.manualOpen) setDoor(d,false); d.manualOpen=d.manualClosed=false; }
    d.t=Math.max(0,Math.min(1,d.t+(d.open?1:-1)*dt*1.3)); const e=d.t*d.t*(3-2*d.t);
    for(const h of d.hinges) h.g.rotation.y=h.target*e; if(!d.open&&d.t===0) d.blocker.off=false; }
  const nd=mode==='visit'?nearestDoor():null; const hint=$('doorHint'); hint.hidden=!nd||clean;
  if(nd){ const txt=nd.open?'Porte automatique ouverte · E ou clic pour fermer':'Ouvrir la porte · E ou clic'; if(hint.textContent!==txt) hint.textContent=txt; } }

/* ---------------- mini-carte ---------------- */
const mini=$('mini'), mg=mini.getContext('2d'); const base=document.createElement('canvas'); base.width=base.height=380;
const MS=380/(Math.max(CX,CZ)*2+1.2); const mx=x=>190+x*MS, mz=z=>190+z*MS;
function drawBase(){ const g=base.getContext('2d'); g.clearRect(0,0,380,380);
  g.fillStyle='#e9e2d2'; g.beginPath(); outline.forEach(([px,py],i)=>{ const p=W(px,py); i?g.lineTo(mx(p.x),mz(p.y)):g.moveTo(mx(p.x),mz(p.y)); }); g.fill();
  for(const [k,r] of Object.entries(ROOMS)){ if(r.gen||r.ext) continue; g.fillStyle=k==='cuisine'||k==='wc'?'#d9dcd6':'#f3eadb'; g.beginPath(); r.poly.forEach((q,i)=>{ const p=W(...q); i?g.lineTo(mx(p.x),mz(p.y)):g.moveTo(mx(p.x),mz(p.y)); }); g.fill(); }
  for(const w of wallRects){ g.save(); g.translate(mx(w.mx),mz(w.mz)); g.rotate(-w.phi); g.fillStyle=w.kind==='win'?'#9fbccc':w.kind==='door'?'#c9a46a':'#3d463a'; g.fillRect(-w.L/2*MS,-w.t/2*MS,w.L*MS,w.t*MS); g.restore(); }
  g.fillStyle='#5d6656'; g.font='600 15px Inter,sans-serif'; g.textAlign='center';
  for(const [k,r] of Object.entries(ROOMS)){ if(r.gen||r.ext||k==='wc'||k==='hall') continue; const p=W(...centroid(r.poly)); g.fillText(r.name.replace('Salle de réunion','Réunion'),mx(p.x),mz(p.y)); }
}
function drawMini(){ mg.clearRect(0,0,380,380); mg.drawImage(base,0,0);
  let x,z,a; if(mode==='visit'){ x=player.x; z=player.y; a=yaw; } else { x=controls.target.x; z=controls.target.z; const d=controls.target.clone().sub(camera.position); a=Math.atan2(-d.x,-d.z); }
  const fx=-Math.sin(a), fz=-Math.cos(a);
  mg.fillStyle='rgba(196,146,47,.35)'; mg.beginPath(); mg.moveTo(mx(x),mz(z)); const ang=Math.atan2(fz,fx); mg.arc(mx(x),mz(z),46,ang-0.6,ang+0.6); mg.fill();
  mg.fillStyle=mode==='visit'?'#c4922f':'rgba(63,90,58,.7)'; mg.beginPath(); mg.arc(mx(x),mz(z),8,0,7); mg.fill(); mg.strokeStyle='#fff'; mg.lineWidth=3; mg.stroke(); }
mini.addEventListener('click',e=>{ const r=mini.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width*380-190)/MS, z=((e.clientY-r.top)/r.height*380-190)/MS;
  const pp=toPx(x,z); const k=Object.keys(ROOMS).find(k=>ROOMS[k].poly&&inPoly(pp,ROOMS[k].poly));
  if(mode!=='visit'){ if(k) gotoRoom(k); return; }
  if(!hits(x,z)){ player.set(x,z); } else if(k) teleport(k); });

/* ---------------- boucle ---------------- */
const clock=new THREE.Clock(); let roomCheck=0;
const ALLMATS=[...new Set(Object.values(M).flat())].filter(m=>m.isMaterial);
function loop(){
  const rawDt=Math.min(clock.getDelta(),1), dt=Math.min(rawDt,0.05);
  if(mode==='overview'){
    if(anim){ anim.t=Math.min(1,anim.t+dt/0.9); const e=1-Math.pow(1-anim.t,3); camera.position.lerpVectors(anim.from,anim.to,e); controls.target.lerpVectors(anim.tf,anim.tt,e); if(anim.t>=1) anim=null; }
    controls.update();
  } else {
    let f=0,s=0; if(keys.KeyW||keys.ArrowUp)f+=1; if(keys.KeyS||keys.ArrowDown)f-=1; if(keys.KeyA)s-=1; if(keys.KeyD)s+=1;
    if(keys.ArrowLeft||keys.KeyQ&&false) yaw+=1.8*dt; if(keys.ArrowRight) yaw-=1.8*dt;
    f+=joy.y; s+=joy.x; const n=Math.hypot(f,s); if(n>1){f/=n;s/=n;}
    const sp=(keys.ShiftLeft||keys.ShiftRight?2.8:1.5)*dt;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw), rx=Math.cos(yaw), rz=-Math.sin(yaw);
    move((fx*f+rx*s)*sp,(fz*f+rz*s)*sp);
    const ppx=toPx(player.x,player.y); eye+=((groundAt(...ppx)+1.62)-eye)*Math.min(1,dt*10);
    camera.position.set(player.x,eye,player.y); camera.rotation.set(pitch,yaw,0);
    if((roomCheck+=dt)>0.3){ roomCheck=0; const pp=toPx(player.x,player.y); const k=Object.keys(ROOMS).find(k=>ROOMS[k].poly&&inPoly(pp,ROOMS[k].poly)); if(k&&k!==current) renderInfo(k); }
  }
  updateDoors(rawDt);
  // écran
  const ss=screenSys; const prev=ss.t; ss.t+=Math.sign(ss.target-ss.t)*Math.min(Math.abs(ss.target-ss.t),rawDt*0.45);
  const drop=Math.min(1,ss.t/0.85); ss.cloth.scale.y=Math.max(0.001,drop); ss.cloth.visible=drop>0.01; ss.bar.position.y=ss.top-0.03-ss.sh*drop-0.015; ss.bar.visible=drop>0.01;
  const on=Math.max(0,(ss.t-0.85)/0.15); ss.img.material.opacity=on; ss.beam.material.opacity=on*0.07; ss.img.visible=ss.beam.visible=on>0.01; /* sinon image et faisceau invisibles marquent quand même le mur */ ss.led.material.color.setHex(ss.t>0.5?0x30ff60:0xff3020); ss.led.material.emissive.copy(ss.led.material.color);
  // soir
  eveT+=(evening-eveT)*Math.min(1,rawDt*3);
  sun.intensity=2.6*(1-eveT)+0.05; hemi.intensity=0.35*(1-eveT)+0.05;
  skyU.uTop.value.copy(skyDayTop).lerp(skyEveTop,eveT); skyU.uHor.value.copy(skyDayHor).lerp(skyEveHor,eveT); skyU.uSunCol.value.setRGB(1,.94,.78).multiplyScalar(1-eveT); scene.fog.color.copy(skyU.uHor.value);
  sky.position.copy(camera.position);
  for(const L of lamps) L.intensity=(L.userData.base??=L.intensity)*(1+eveT*2.5);
  for(const n of nightLights) n.l.intensity=n.base*eveT; for(const m of washMats) m.opacity=eveT; for(const n of nightGlow) n.m.emissiveIntensity=n.base*eveT;
  for(const m of ALLMATS) m.envMapIntensity=0.5*(1-eveT*0.75);
  cowG.visible = mode==='visit' && current==='reunion'; // la vache n'apparaît que vue de la salle de réunion
  if(composer&&useAO) composer.render(); else renderer.render(scene,camera); drawMini(); requestAnimationFrame(loop);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer?.setSize(innerWidth,innerHeight); });
{ const b=$('tAO'); if(!composer) b.hidden=true; b.classList.toggle('on',useAO); b.onclick=()=>{ useAO=!useAO; b.classList.toggle('on',useAO); }; }
drawBase(); renderInfo('general'); setMode('overview'); camera.position.copy(HOME); anim=null;
$('loading').remove(); loop();
</script>
